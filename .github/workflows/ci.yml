name: SteadyGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-and-perception:
    name: TypeScript & Perception Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Strict Compilation
        run: npm run typecheck

      - name: Next.js ESLint
        run: npm run lint

      - name: Next.js Build
        run: npm run build

      - name: Run Gesture Robustness Suite (HaGRID 500)
        run: npx tsx tests/gesture-robustness.test.ts

      - name: Run Adversarial Challenger Suites
        run: |
          npx tsx tests/adversarial-challenger-1.ts
          npx tsx tests/adversarial-challenger-2.test.ts

      - name: Run Global Adversarial Batteries (G1-G11)
        run: npx tsx tests/global-v4-adversarial.test.ts

  python-digital-twin:
    name: Python Digital Twin & Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: pytest -v

  flagship-verification-gate:
    name: Single-Command Flagship Verification Gate
    needs: [typescript-and-perception, python-digital-twin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Execute Full 8-Step Verification Suite
        run: npx tsx scripts/verify-v6-all.ts
